<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Service | SwiftConvert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #privacy-modal { display: none; }
        #privacy-modal.active { display: flex; }
        .modal-glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
             
        .nav-link {
            position: relative;
            font-size: 11px;
            font-weight: 800;
            text-transform: none;
            letter-spacing: 0.15em;
            color: #64748b;
            transition: all 0.3s ease;
        }
        .nav-link:hover { color: #4f46e5; }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #4f46e5;
            transition: width 0.3s ease;
            border-radius: 2px;
        }
        .nav-link:hover::after, .nav-active::after { width: 100%; }
        .nav-active { color: #4f46e5 !important; }
             
        .brand-dot {
            height: 4px; width: 4px;
            background-color: #4f46e5;
            border-radius: 50%;
            display: inline-block;
            margin-left: 2px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pt-32 px-4">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-100/50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center group">
                <span class="text-xl font-black ... hidden sm:inline">
                  Swift<span class="text-indigo-600">Convert</span>
                </span>
                <span class="text-xl font-black sm:hidden">
                  SC
                </span>
            </a>
            <div class="flex items-center space-x-8">
                <a data-i18n="home" href="index.html" class="nav-link">Home</a>
                <button id="lang-toggle" class="text-[10px] font-black tracking-widest text-slate-500 px-4 py-2 rounded-full border border-slate-200 bg-white shadow-sm transition-all active:scale-95">
                    <span id="lang-btn-text">中文</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto bg-white rounded-[2.5rem] p-10 md:p-16 shadow-xl border border-slate-100">
        <h1 data-i18n="title" class="text-3xl font-black mb-10 tracking-tight text-slate-800">Terms of Service</h1>
        
        <div id="content" class="prose prose-slate max-w-none space-y-8 text-slate-600">
            </div>
    </main>

    <footer class="text-center py-12 text-[10px] text-slate-300 font-black tracking-[0.4em]">
        &copy; 2026 SwiftConvert. All rights reserved.
    </footer>

    <script>
        const i18n = {
            en: {
                home: 'Home',
                title: 'Terms of Service',
                content: `
                    <section>
                        <h2 class="text-xl font-bold text-slate-800 mb-4">1. Acceptance of Terms</h2>
                        <p>By accessing SwiftConvert, you agree to be bound by these Terms of Service. Our tools are provided for free to assist with image and document processing.</p>
                    </section>
                    <section>
                        <h2 class="text-xl font-bold text-slate-800 mb-4">2. Use of Service</h2>
                        <p>You agree to use this service only for lawful purposes. You must not use the tool to process content that infringes on third-party intellectual property rights.</p>
                    </section>
                    <section>
                        <h2 class="text-xl font-bold text-slate-800 mb-4">3. Disclaimer of Liability</h2>
                        <p>SwiftConvert is provided "as is" without any warranties. We are not responsible for any data loss, damages, or consequences arising from the use of our local conversion tools.</p>
                    </section>
                `
            },
            zh: {
                home: '首页',
                title: '服务条款',
                content: `
                    <section>
                        <h2 class="text-xl font-bold text-slate-800 mb-4">1. 接受条款</h2>
                        <p>访问 SwiftConvert 即表示您同意受这些服务条款的约束。我们的工具免费提供，旨在协助图像和文档处理。</p>
                    </section>
                    <section>
                        <h2 class="text-xl font-bold text-slate-800 mb-4">2. 服务使用</h2>
                        <p>您同意仅出于合法目的使用本服务。您不得利用本工具处理任何侵犯第三方知识产权的内容。</p>
                    </section>
                    <section>
                        <h2 class="text-xl font-bold text-slate-800 mb-4">3. 免责声明</h2>
                        <p>SwiftConvert 按“原样”提供，不提供任何保证。对于因使用我们的本地转换工具而导致的任何数据丢失、损坏或后果，我们不承担任何责任。</p>
                    </section>
                `
            }
        };

        let currentLang = localStorage.getItem('swiftconvert_lang') || 'en';

        function applyLanguage(lang) {
            currentLang = lang;
            
            // 1. 更新标题
            const titleEl = document.querySelector('[data-i18n="title"]');
            if (titleEl) titleEl.innerText = i18n[lang].title;

            // 2. 更新正文
            const contentEl = document.getElementById('content');
            if (contentEl) contentEl.innerHTML = i18n[lang].content;
            
            // 3. 扫描并更新所有 data-i18n 元素 (处理 Home 链接)
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) {
                    el.innerText = i18n[lang][key];
                }
            });

            // 4. 更新语言切换按钮
            const btnText = document.getElementById('lang-btn-text');
            if (btnText) btnText.innerText = lang === 'en' ? '中文' : 'English';
            
            localStorage.setItem('swiftconvert_lang', lang);
        }

        // 初始化
        applyLanguage(currentLang);

        // 绑定事件
        document.getElementById('lang-toggle').onclick = () => {
            applyLanguage(currentLang === 'en' ? 'zh' : 'en');
        };
    </script>
</body>
</html>
