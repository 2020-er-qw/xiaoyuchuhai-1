<div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script>
        let cropper; // Cropper.js 实例

		// 1. 初始化当前语言 (增强版)
		let currentLang = (() => {
		    const urlParams = new URLSearchParams(window.location.search);
		    const langParam = urlParams.get('lang');
		    if (langParam && i18nData[langParam]) return langParam;
		
		    const savedLang = localStorage.getItem('swiftconvert_lang');
		    if (savedLang && i18nData[savedLang]) return savedLang;
		
		    // 浏览器语言检测
		    const browserLangs = navigator.languages || [navigator.language];
		    console.log("Browser languages found:", browserLangs); // 调试用
		
		    for (let lang of browserLangs) {
		        // 尝试完整匹配 (zh-CN)
		        if (i18nData[lang]) return lang;
		        
		        // 尝试短码匹配 (zh)
		        const short = lang.split('-')[0];
		        if (i18nData[short]) return short;
		    }
		
		    return 'en';
		})();
		
		
		// 翻译辅助工具
		function t(key) {
		    return i18nData?.[currentLang]?.[key] || key;
		}
		
		// 应用/切换语言
		function applyLanguage(lang) {
		    currentLang = lang;
		    document.documentElement.lang = lang;
		    
		    // A. 静态元素翻译
		    document.querySelectorAll('[data-i18n]').forEach(el => {
		        const key = el.dataset.i18n;
		        if (i18nData[lang] && i18nData[lang][key]) el.innerHTML = i18nData[lang][key];
		    });
		
		    // B. 动态任务文字翻译 (包含状态 + 动作名称 + 文件名)
		    document.querySelectorAll('[data-task-key]').forEach(el => {
		        updateTaskText(el);
		    });
		
		    // C. 动态按钮翻译
		    document.querySelectorAll('.btn-download-dynamic').forEach(el => {
		        el.innerText = t('btn_download');
		    });
		
		    // D. UI 控件状态同步
		    const langBtnText = document.getElementById('lang-btn-text');
		    if (langBtnText) langBtnText.innerText = lang === 'en' ? '中文' : 'English';
		    
		    const langSelectMobile = document.getElementById('lang-select-mobile');
		    if (langSelectMobile) langSelectMobile.value = lang;
		
		    localStorage.setItem('swiftconvert_lang', lang);
		}
		
		/**
		 * 3. 异步组件加载 (Nav/Footer)
		 */
		async function initSite() {
		    const containers = [
		        { id: 'nav-placeholder', path: 'nav.html' },
		        { id: 'footer-placeholder', path: 'footer.html' }
		    ];
		
		    await Promise.all(containers.map(async (item) => {
		        const el = document.getElementById(item.id);
		        if (el) {
		            try {
		                const res = await fetch(item.path);
		                if (res.ok) el.innerHTML = await res.text();
		            } catch (err) { console.error(`Load failed: ${item.path}`, err); }
		        }
		    }));
		
		    // 初始化页面语言
		    applyLanguage(currentLang);
		
		    // --- 3. 移动端菜单开关逻辑 ---
		    const menuBtn = document.getElementById('mobile-menu-btn');
		    const mobileMenu = document.getElementById('mobile-menu');
		    const menuPath = document.getElementById('menu-path');
		    
		    if (menuBtn && mobileMenu) {
		        menuBtn.onclick = () => {
		            const isHidden = mobileMenu.classList.toggle('hidden');
		            if (!isHidden) {
		                menuPath.setAttribute('d', 'M6 18L18 6M6 6l12 12');
		            } else {
		                menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
		            }
		        };
		    }
		    
		    // --- 4. 移动端语言下拉框逻辑 ---
		    const langSelectMobile = document.getElementById('lang-select-mobile');
		    if (langSelectMobile) {
		        langSelectMobile.onchange = (e) => {
		            applyLanguage(e.target.value);
		            
		            // 切换后自动平滑收起菜单
		            if (mobileMenu) mobileMenu.classList.add('hidden');
		            if (menuPath) menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
		        };
		    }
		    
		    // --- 5. 桌面端语言切换按钮逻辑 ---
		    // 因为 nav.html 是动态加载的，必须在 initSite 内部重新寻找并绑定
		    const langToggle = document.getElementById('lang-toggle');
		    if (langToggle) {
		        langToggle.onclick = (e) => {
		            e.preventDefault();
		            // 切换语言
		            const newLang = currentLang === 'en' ? 'zh' : 'en';
		            applyLanguage(newLang);
		        };
		    }
		}
		
		


        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const controls = document.getElementById('controls');
        const imageToCrop = document.getElementById('image-to-crop');
        const cropDownloadBtn = document.getElementById('crop-download-btn');
        const resetBtn = document.getElementById('reset-btn');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                imageToCrop.src = e.target.result;
                controls.classList.remove('hidden');
                dropZone.classList.add('hidden');

                // 如果已经有 Cropper 实例，先销毁
                if (cropper) {
                    cropper.destroy();
                }

                // 初始化 Cropper.js
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: NaN, // 自由裁剪
                    viewMode: 1, // 限制裁剪框在图片内部
                    autoCropArea: 0.8, // 初始裁剪区域大小
                    background: false, // 不显示 Cropper 背景网格
                });
            };
            reader.readAsDataURL(file);
        }

        // 裁剪操作按钮 (旋转、翻转)
        document.querySelectorAll('.action-btn').forEach(button => {
            button.addEventListener('click', () => {
                if (cropper) {
                    const method = button.dataset.method;
                    const option = parseFloat(button.dataset.option);
                    let scaleX = 1;
                    let scaleY = 1;

                    if (method === 'scaleX') {
                        scaleX = -cropper.getData().scaleX || -1; // 反转当前状态
                        cropper.scaleX(scaleX);
                    } else if (method === 'scaleY') {
                        scaleY = -cropper.getData().scaleY || -1; // 反转当前状态
                        cropper.scaleY(scaleY);
                    } else {
                        cropper[method](option);
                    }
                }
            });
        });


        // 下载裁剪后的图片
        cropDownloadBtn.onclick = () => {
            if (cropper) {
                const croppedCanvas = cropper.getCroppedCanvas();
                const link = document.createElement('a');
                link.download = `cropped-swiftconvert-${Date.now()}.jpg`;
                link.href = croppedCanvas.toDataURL('image/jpeg', 0.9); // 默认导出为 JPG，质量90%
                link.click();
            }
        };

        // 重新上传按钮逻辑
        resetBtn.onclick = () => {
            if (cropper) {
                cropper.destroy(); // 销毁 Cropper 实例
            }
            fileInput.value = ""; // 清空文件输入
            imageToCrop.src = "#"; // 清空图片源
            controls.classList.add('hidden');
            dropZone.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

// --- 4. 启动启动 ---
document.addEventListener('DOMContentLoaded', () => {
    initSite();          // 加载 Nav/Footer/i18n
});
    </script>
