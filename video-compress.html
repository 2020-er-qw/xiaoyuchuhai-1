    <style>
        body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }

<body>

    <div id="header-box"></div>

    <div class="tool-container">

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 pb-6 border-b border-slate-50 gap-4">
                <div class="text-left">
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">视频压缩</h1>
                    <p class="text-[10px] text-indigo-500 mt-1.5 font-bold uppercase tracking-[0.2em]">本地硬件加速压缩技术</p>
                </div>
                <div id="file-count" class="text-[11px] font-mono bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl border border-indigo-100 font-bold">
                    未选择视频

            </div>

            <div id="drop-zone" class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-2xl py-14 text-center cursor-pointer hover:border-indigo-300 hover:bg-indigo-50/30 transition-all mb-10 group">
                <input type="file" id="file-input" class="hidden" accept="video/*" multiple>
                <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mb-5 group-hover:scale-110 transition-transform">
                    <i class="fas fa-video text-indigo-500 text-2xl"></i>
                </div>
                <p class="text-base font-bold text-slate-700">将视频文件拖入此处</p>
                <p class="text-[11px] text-slate-400 mt-2 font-medium">支持 MP4, WebM, MOV (本地处理，无隐私泄露)</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 p-6 bg-slate-50 rounded-2xl border border-slate-100">
                <div class="relative">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-2 block">压缩质量 (目标大小)</label>
                    <select id="quality-select" class="select-custom w-full bg-white border border-slate-200 text-slate-600 py-4 px-5 rounded-xl font-bold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 transition-all">
                        <option value="0.7">标准压缩 (推荐)</option>
                        <option value="0.5">高强度压缩 (体积更小)</option>
                        <option value="0.9">轻微压缩 (保留超清画质)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-2 block">输出分辨率</label>
                    <select id="res-select" class="select-custom w-full bg-white border border-slate-200 text-slate-600 py-4 px-5 rounded-xl font-bold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 transition-all">
                        <option value="original" selected>保持原片大小</option>
                        <option value="1080">1080P Full HD</option>
                        <option value="720">720P HD</option>
                        <option value="480">480P 标清</option>
                    </select>
                </div>
            </div>

            <div id="file-list" class="mb-10 min-h-[50px]"></div>

            <button id="compress-btn" class="w-full btn-indigo text-white py-5 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-lg shadow-indigo-100 uppercase tracking-widest text-sm disabled:opacity-40" disabled>
                <i class="fas fa-file-video"></i> 开始转换并导出

                <div class="flex justify-between items-center mb-3">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">正在利用 CPU 渲染视频帧</span>
                    <span id="progress-text" class="text-xs font-mono text-indigo-500 font-bold">0%</span>
                </div>

        <section class="tech-grid">
            <div class="tech-item border border-slate-100">

                <h3 class="text-base font-bold text-slate-800 mb-4 uppercase tracking-wider">智能重编码</h3>
                <p class="text-[13px] leading-relaxed text-slate-500">自动识别视频关键帧，通过优化视频流的比特率分布，在视觉感官不变的前提下大幅削减体积。</p>
            </div>
            <div class="tech-item border border-slate-100">

                </div>
                <h3 class="text-base font-bold text-slate-800 mb-4 uppercase tracking-wider">端到端隐私</h3>
                <p class="text-[13px] leading-relaxed text-slate-500">视频文件处理完全在您的浏览器缓存中运行。数据不离本地，不上传云端，确保隐私万无一失。</p>
            </div>

    <div id="footer-box"></div>

    <script>
        // 核心逻辑保持一致，后续可集成 ffmpeg.wasm
        let filesArray = [];
        const fileList = document.getElementById('file-list');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const compressBtn = document.getElementById('compress-btn');

        async function loadLayout() {
            try {
                const [h, f] = await Promise.all([
                    fetch(`components/header_zh`).then(r => r.text()),
                    fetch(`components/footer_zh`).then(r => r.text())
                ]);
                document.getElementById('header-box').innerHTML = h;
                document.getElementById('footer-box').innerHTML = f;
            } catch(e) {}
        }
        loadLayout();

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            for (let file of e.target.files) {
                const id = Date.now() + Math.random();
                filesArray.push({ id, file });
                renderFileItem(file, id);
            }
            updateUI();
            fileInput.value = '';
        };

        function renderFileItem(file, id) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.dataset.id = id;
            div.innerHTML = `
                <div class="flex items-center gap-5">
                    <i class="fas fa-film text-slate-200"></i>
                    <div class="text-left">
                        <p class="text-sm font-bold text-slate-700 truncate max-w-[200px] md:max-w-[400px]">${file.name}</p>
                        <p class="text-[10px] text-slate-400 font-mono mt-1">${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                    </div>
                </div>
                <button onclick="removeFile(${id})" class="text-slate-200 hover:text-red-400 p-2"><i class="fas fa-times-circle text-lg"></i></button>
            `;
            fileList.appendChild(div);
        }

        window.removeFile = (id) => {
            filesArray = filesArray.filter(f => f.id !== id);
            const el = document.querySelector(`[data-id="${id}"]`);
            if (el) el.remove();
            updateUI();
        };

        function updateUI() {
            const count = filesArray.length;
            document.getElementById('file-count').innerText = count === 0 ? '未选择视频' : `待处理 ${count} 个任务`;
            compressBtn.disabled = count === 0;
        }

        compressBtn.onclick = async () => {
            const statusBox = document.getElementById('processing-status');
            const bar = document.getElementById('progress-bar');
            const pctText = document.getElementById('progress-text');
            
            statusBox.classList.remove('hidden');
            compressBtn.disabled = true;
        
            // 获取用户设置的压缩强度（通过比特率实现）
            const qualityMultiplier = parseFloat(document.getElementById('quality-select').value); // 0.5, 0.7, 0.9
        
            for (let i = 0; i < filesArray.length; i++) {
                const file = filesArray[i].file;
                pctText.innerText = `正在分析: ${file.name}`;
                
                try {
                    const compressedBlob = await compressVideo(file, qualityMultiplier, (p) => {
                        const total = Math.round(((i + (p/100)) / filesArray.length) * 100);
                        bar.style.width = `${total}%`;
                        pctText.innerText = `${total}% (正在重采样渲染...)`;
                    });
        
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(compressedBlob);
                    link.download = `SwiftConvert_Small_${file.name.split('.')[0]}.mp4`;
                    link.click();
                } catch (err) {
                    console.error(err);
                    alert(`${file.name} 压缩失败，可能是浏览器编码器限制。`);
                }
            }
        
            statusBox.classList.add('hidden');
            compressBtn.disabled = false;
        };
        
        // --- 真正的压缩执行函数 ---
        function compressVideo(file, quality, onProgress) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.muted = true;
                video.playsInline = true;
        
                video.onloadedmetadata = () => {
                    const stream = video.captureStream();
                    // 计算目标比特率：原视频体积 / 时长 * 质量系数
                    // 假设平均 128kbps 是极小体积，2Mbps 是高清
                    const targetBitrate = 1000000 * quality; 
        
                    const recorder = new MediaRecorder(stream, {
                        mimeType: 'video/webm;codecs=vp8', // 浏览器兼容性最好的压缩格式
                        videoBitsPerSecond: targetBitrate 
                    });
        
                    const chunks = [];
                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/mp4' });
                        resolve(blob);
                    };
        
                    video.play();
                    recorder.start();
        
                    // 模拟进度监听
                    const interval = setInterval(() => {
                        const progress = (video.currentTime / video.duration) * 100;
                        onProgress(progress);
                        if (video.ended) {
                            recorder.stop();
                            clearInterval(interval);
                            URL.revokeObjectURL(video.src);
                        }
                    }, 100);
                };
        
                video.onerror = () => reject('视频加载失败');
            });
        }
    </script>
