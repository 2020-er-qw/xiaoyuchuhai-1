<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy | SwiftConvert</title>

	<link rel="canonical" href="https://www.swiftconvert.ink/privacy" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    
    <!-- Favicon / Google Search / Browser -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
        
    <!-- Apple iOS -->
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png">
        
    <!-- Android / PWA -->
    <link rel="manifest" href="/site.webmanifest">
	
	
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

		#privacy-modal { display: none; }
		#privacy-modal.active { display: flex; }
		.modal-glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
		     
		.nav-link {
		    position: relative;
		    font-size: 11px;
		    font-weight: 800;
		    text-transform: none;
		    letter-spacing: 0.15em;
		    color: #64748b;
		    transition: all 0.3s ease;
		}
		.nav-link:hover { color: #4f46e5; }
		.nav-link::after {
		    content: '';
		    position: absolute;
		    bottom: -4px;
		    left: 0;
		    width: 0;
		    height: 2px;
		    background: #4f46e5;
		    transition: width 0.3s ease;
		    border-radius: 2px;
		}
		.nav-link:hover::after, .nav-active::after { width: 100%; }
		.nav-active { color: #4f46e5 !important; }
		     
		.brand-dot {
		    height: 4px; width: 4px;
		    background-color: #4f46e5;
		    border-radius: 50%;
		    display: inline-block;
		    margin-left: 2px;
		}
		
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pt-32 px-4">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-100/50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center group">
                <span class="text-xl font-black ... hidden sm:inline">
                  Swift<span class="text-indigo-600">Convert</span>
                </span>
                <span class="text-xl font-black sm:hidden">
                  SC
                </span>
            </a>
            <div class="flex items-center space-x-8">
                <a data-i18n="home" href="index.html" class="nav-link">Home</a>
                <button id="lang-toggle" class="hidden md:flex items-center space-x-2 text-[10px] font-black  tracking-widest text-slate-500 hover:text-indigo-600 px-4 py-2 rounded-full border border-slate-200 bg-white shadow-sm transition-all active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                    <span id="lang-btn-text">中文</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto bg-white rounded-[2.5rem] p-10 md:p-16 shadow-xl border border-slate-100">
        <h1 data-i18n="title" class="text-3xl font-black mb-10 tracking-tight text-slate-800">Privacy Policy</h1>
        
        <div id="content" class="prose prose-slate max-w-none space-y-8 text-slate-600">
            </div>
    </main>

    <footer class="text-center py-12 text-[10px] text-slate-300 font-black tracking-[0.4em]">
        &copy; 2026 SwiftConvert. All rights reserved.
    </footer>

<script>
    const i18n = {
        en: {
            home: 'Home', // 补充导航翻译
            title: 'Privacy Policy',
            content: `
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">1. Data Processing & Privacy</h2>
                    <p>SwiftConvert utilizes cutting-edge local browser processing technology. Your images, PDFs, and documents are <strong>never uploaded to any server</strong>. All operations are completed entirely within your device's memory.</p>
                </section>
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">2. Google AdSense & Cookies</h2>
                    <p>We use Google AdSense to serve ads. Google, as a third-party vendor, uses cookies to serve ads based on your visit to this site and other sites on the Internet. You may opt out of personalized advertising by visiting the <a href="https://adssettings.google.com/" class="text-indigo-600 underline">Google Ad Settings</a>.</p>
                </section>
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">3. Information Collection</h2>
                    <p>We do not collect personal identifiable information. We use Google Analytics to collect anonymous traffic data to improve user experience. Your files are not stored, viewed, or accessible by us.</p>
                </section>
            `
        },
        zh: {
            home: '首页', // 补充导航翻译
            title: '隐私政策',
            content: `
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">1. 数据处理与隐私</h2>
                    <p>SwiftConvert 采用先进的浏览器本地处理技术。您的图片、PDF 及文档在转换过程中<strong>绝不会上传到任何服务器</strong>。所有操作均在您的设备内存中完成。</p>
                </section>
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">2. Google AdSense 与 Cookie</h2>
                    <p>我们使用 Google AdSense 投放广告。Google 作为第三方供应商，会使用 Cookie 根据用户访问本站或其他网站的情况，向用户投放个性化广告。您可以访问 <a href="https://adssettings.google.com/" class="text-indigo-600 underline">Google 广告设置</a>来停用个性化广告。</p>
                </section>
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">3. 信息收集</h2>
                    <p>我们不收集个人身份信息。我们通过 Google Analytics 收集匿名流量数据以改进用户体验。您的文件不会被我们存储、查看或访问。</p>
                </section>
            `
        }
    };

    let currentLang = localStorage.getItem('swiftconvert_lang') || 'en';

    function applyLanguage(lang) {
        currentLang = lang;
        
        // 1. 更新标题和正文
        document.querySelector('[data-i18n="title"]').innerText = i18n[lang].title;
        document.getElementById('content').innerHTML = i18n[lang].content;
        
        // 2. 关键修复：循环更新所有带有 data-i18n 属性的元素（如 Home 链接）
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang][key]) {
                el.innerText = i18n[lang][key];
            }
        });

        // 3. 更新按钮文字
        document.getElementById('lang-btn-text').innerText = lang === 'en' ? '中文' : 'English';
        localStorage.setItem('swiftconvert_lang', lang);
    }

    applyLanguage(currentLang);
    document.getElementById('lang-toggle').onclick = () => applyLanguage(currentLang === 'en' ? 'zh' : 'en');
</script>
</body>
</html>
