	<script src="js/i18n-data.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
	/* 统一引入 Plus Jakarta Sans */
	@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
	
	body { 
	    font-family: 'Plus Jakarta Sans', sans-serif; 
	    background-color: #fcfcfd; 
	    color: #1e293b;
	}
	    
	/* 移除所有强制大写和斜体，保持自然感 */
	.font-brand { font-weight: 800; tracking: -0.02em; }
	
	/* 模拟 localconvert 的卡片悬停效果 */

	    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
	}
	.tool-card:hover {
	    transform: translateY(-5px);
	    border-color: #4f46e5;
	    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05);
	}

<body class="bg-slate-50 min-h-screen pt-24 pb-12">
<div id="nav-placeholder"></div> 
    <main class="max-w-4xl mx-auto px-6">

		<div class="text-center mb-12">
		    <h1 data-i18n="rotate_title" class="text-4xl font-black text-slate-900 mb-4 tracking-tight"> <span class="text-indigo-600"></span></h1>
		    <p data-i18n="rotate_desc" class="text-slate-500"></p>
		</div>

        <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 shadow-sm">
            <div id="drop-zone" class="border-2 border-dashed border-slate-200 rounded-[2rem] p-12 text-center cursor-pointer hover:border-indigo-400 group">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <p class="font-black text-slate-900" data-i18n="drop_text">Click or Drop Image Here</p>
				<p class="text-slate-400 text-xs mt-2" data-i18n="format_support">Supports JPG, PNG</p>
            </div>

            <div id="controls" class="hidden mt-8 space-y-8 animate-in fade-in">
                <div class="flex flex-col items-center justify-center bg-slate-50 rounded-[2rem] p-8 min-h-[300px]">
                    <img id="preview-img" class="max-h-[400px] rounded shadow-lg preview-container">
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button onclick="rotate(-90)" class="py-4 bg-slate-100 rounded-xl font-black text-[10px]  hover:bg-indigo-50 hover:text-indigo-600 transition-all flex flex-col items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                        <span data-i18n="rotate_left">Rotate -90°</span>
                    </button>
                    <button onclick="rotate(90)" class="py-4 bg-slate-100 rounded-xl font-black text-[10px]  hover:bg-indigo-50 hover:text-indigo-600 transition-all flex flex-col items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        <span data-i18n="rotate_right">Rotate +90°</span>
                    </button>
                    <button onclick="flip('h')" class="py-4 bg-slate-100 rounded-xl font-black text-[10px]  hover:bg-indigo-50 hover:text-indigo-600 transition-all flex flex-col items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                        <span data-i18n="flip_h">Flip Horizontal</span>
                    </button>
                    <button onclick="flip('v')" class="py-4 bg-slate-100 rounded-xl font-black text-[10px]  hover:bg-indigo-50 hover:text-indigo-600 transition-all flex flex-col items-center gap-2">
                        <svg class="w-5 h-5 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                        <span data-i18n="flip_v">Flip Vertical</span>
                    </button>
                </div>

                <button id="download-btn" class="w-full py-5 bg-indigo-600 text-white rounded-[1.5rem] font-black  tracking-widest hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100" data-i18n="download_btn">
                    Download Image
                </button>
                
                <button id="reset-btn" class="w-full py-2 text-slate-400 font-black  text-[10px] tracking-widest hover:text-indigo-600 transition-colors" data-i18n="reset_btn">
                    Upload Another Image
                </button>
            </div>
        </div>
		<section class="mt-24 mb-20 bg-indigo-50/50 py-16 rounded-[3rem]">
		    <div class="max-w-3xl mx-auto px-6 text-center">
		        <h2 class="text-3xl font-black mb-12 text-slate-900" data-i18n="faq_title">FAQ</h2>
		        <div class="space-y-6 text-left">
		            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
		                <h4 class="font-bold text-lg text-slate-900 mb-2" data-i18n="faq_rotate_q1"></h4>
		                <p class="text-slate-500 text-sm leading-relaxed" data-i18n="faq_rotate_a1"></p>
		            </div>
					<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
					    <h4 class="font-bold text-lg text-slate-900 mb-2" data-i18n="faq_rotate_q2"></h4>
					    <p class="text-slate-500 text-sm leading-relaxed" data-i18n="faq_rotate_a2"></p>
					</div>
					<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
					    <h4 class="font-bold text-lg text-slate-900 mb-2" data-i18n="faq_rotate_q3"></h4>
					    <p class="text-slate-500 text-sm leading-relaxed" data-i18n="faq_rotate_a3"></p>
					</div>
		        </div>
		    </div>
		</section>
    </main>
	<div id="footer-placeholder"></div>

    <script>

        let rotation = 0;
        let flipH = 1;
        let flipV = 1;
        let originalImg = null;

		// 1. 初始化当前语言 (增强版)
		let currentLang = (() => {
		    const urlParams = new URLSearchParams(window.location.search);
		    const langParam = urlParams.get('lang');
		    if (langParam && i18nData[langParam]) return langParam;
		
		    const savedLang = localStorage.getItem('swiftconvert_lang');
		    if (savedLang && i18nData[savedLang]) return savedLang;
		
		    // 浏览器语言检测
		    const browserLangs = navigator.languages || [navigator.language];
		    console.log("Browser languages found:", browserLangs); // 调试用
		
		    for (let lang of browserLangs) {
		        // 尝试完整匹配 (zh-CN)
		        if (i18nData[lang]) return lang;
		        
		        // 尝试短码匹配 (zh)
		        const short = lang.split('-')[0];
		        if (i18nData[short]) return short;
		    }
		
		    return 'en';
		})();
		
		
		// 翻译辅助工具
		function t(key) {
		    return i18nData?.[currentLang]?.[key] || key;
		}
		
		// 应用/切换语言
		function applyLanguage(lang) {
		    currentLang = lang;
		    document.documentElement.lang = lang;
		    
		    // A. 静态元素翻译
		    document.querySelectorAll('[data-i18n]').forEach(el => {
		        const key = el.dataset.i18n;
		        if (i18nData[lang] && i18nData[lang][key]) el.innerHTML = i18nData[lang][key];
		    });
		
		    // B. 动态任务文字翻译 (包含状态 + 动作名称 + 文件名)
		    document.querySelectorAll('[data-task-key]').forEach(el => {
		        updateTaskText(el);
		    });
		
		    // C. 动态按钮翻译
		    document.querySelectorAll('.btn-download-dynamic').forEach(el => {
		        el.innerText = t('btn_download');
		    });
		
		    // D. UI 控件状态同步
		    const langBtnText = document.getElementById('lang-btn-text');
		    if (langBtnText) langBtnText.innerText = lang === 'en' ? '中文' : 'English';
		    
		    const langSelectMobile = document.getElementById('lang-select-mobile');
		    if (langSelectMobile) langSelectMobile.value = lang;
		
		    localStorage.setItem('swiftconvert_lang', lang);
		}
		
		/**
		 * 3. 异步组件加载 (Nav/Footer)
		 */
		async function initSite() {
		    const containers = [
		        { id: 'nav-placeholder', path: 'nav.html' },
		        { id: 'footer-placeholder', path: 'footer.html' }
		    ];
		
		    await Promise.all(containers.map(async (item) => {
		        const el = document.getElementById(item.id);
		        if (el) {
		            try {
		                const res = await fetch(item.path);
		                if (res.ok) el.innerHTML = await res.text();
		            } catch (err) { console.error(`Load failed: ${item.path}`, err); }
		        }
		    }));
		
		    // 初始化页面语言
		    applyLanguage(currentLang);
		
		    // --- 3. 移动端菜单开关逻辑 ---
		    const menuBtn = document.getElementById('mobile-menu-btn');
		    const mobileMenu = document.getElementById('mobile-menu');
		    const menuPath = document.getElementById('menu-path');
		    
		    if (menuBtn && mobileMenu) {
		        menuBtn.onclick = () => {
		            const isHidden = mobileMenu.classList.toggle('hidden');
		            if (!isHidden) {
		                menuPath.setAttribute('d', 'M6 18L18 6M6 6l12 12');
		            } else {
		                menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
		            }
		        };
		    }
		    
		    // --- 4. 移动端语言下拉框逻辑 ---
		    const langSelectMobile = document.getElementById('lang-select-mobile');
		    if (langSelectMobile) {
		        langSelectMobile.onchange = (e) => {
		            applyLanguage(e.target.value);
		            
		            // 切换后自动平滑收起菜单
		            if (mobileMenu) mobileMenu.classList.add('hidden');
		            if (menuPath) menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
		        };
		    }
		    
		    // --- 5. 桌面端语言切换按钮逻辑 ---
		    // 因为 nav.html 是动态加载的，必须在 initSite 内部重新寻找并绑定
		    const langToggle = document.getElementById('lang-toggle');
		    if (langToggle) {
		        langToggle.onclick = (e) => {
		            e.preventDefault();
		            // 切换语言
		            const newLang = currentLang === 'en' ? 'zh' : 'en';
		            applyLanguage(newLang);
		        };
		    }
		}

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const controls = document.getElementById('controls');
        const previewImg = document.getElementById('preview-img');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImg = img;
                    previewImg.src = e.target.result;
                    controls.classList.remove('hidden');
                    dropZone.classList.add('hidden');
                    resetTransform();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetTransform() {
            rotation = 0; flipH = 1; flipV = 1;
            updatePreview();
        }

        function rotate(deg) {
            rotation = (rotation + deg) % 360;
            updatePreview();
        }

        function flip(dir) {
            if (dir === 'h') flipH *= -1;
            else flipV *= -1;
            updatePreview();
        }

        function updatePreview() {
            previewImg.style.transform = `rotate(${rotation}deg) scale(${flipH}, ${flipV})`;
        }

        document.getElementById('download-btn').onclick = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 计算旋转后的画布尺寸
            const is90 = Math.abs(rotation) % 180 === 90;
            canvas.width = is90 ? originalImg.height : originalImg.width;
            canvas.height = is90 ? originalImg.width : originalImg.height;

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(rotation * Math.PI / 180);
            ctx.scale(flipH, flipV);
            ctx.drawImage(originalImg, -originalImg.width / 2, -originalImg.height / 2);

            const link = document.createElement('a');
            link.download = `rotated-${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        };

        document.getElementById('reset-btn').onclick = () => {
            controls.classList.add('hidden');
            dropZone.classList.remove('hidden');
            fileInput.value = "";
        };

        // --- 4. 启动启动 ---
        document.addEventListener('DOMContentLoaded', () => {
            initSite();          // 加载 Nav/Footer/i18n
        });
    </script>
</body>
