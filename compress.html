    <script>

/**
 * SwiftConvert 重新整理版 JS
 * 包含：多语言引擎、站点初始化、图片压缩业务
 */
// 1. 初始化当前语言 (增强版)
let currentLang = (() => {
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    if (langParam && i18nData[langParam]) return langParam;

    const savedLang = localStorage.getItem('swiftconvert_lang');
    if (savedLang && i18nData[savedLang]) return savedLang;

    // 浏览器语言检测
    const browserLangs = navigator.languages || [navigator.language];
    console.log("Browser languages found:", browserLangs); // 调试用

    for (let lang of browserLangs) {
        // 尝试完整匹配 (zh-CN)
        if (i18nData[lang]) return lang;
        
        // 尝试短码匹配 (zh)
        const short = lang.split('-')[0];
        if (i18nData[short]) return short;
    }

    return 'en';
})();


// 翻译辅助工具
function t(key) {
    return i18nData?.[currentLang]?.[key] || key;
}

// 应用/切换语言
function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    
    // A. 静态元素翻译
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18nData[lang] && i18nData[lang][key]) el.innerHTML = i18nData[lang][key];
    });

    // B. 动态任务文字翻译 (包含状态 + 动作名称 + 文件名)
    document.querySelectorAll('[data-task-key]').forEach(el => {
        updateTaskText(el);
    });

    // C. 动态按钮翻译
    document.querySelectorAll('.btn-download-dynamic').forEach(el => {
        el.innerText = t('btn_download');
    });

    // D. UI 控件状态同步
    const langBtnText = document.getElementById('lang-btn-text');
    if (langBtnText) langBtnText.innerText = lang === 'en' ? '中文' : 'English';
    
    const langSelectMobile = document.getElementById('lang-select-mobile');
    if (langSelectMobile) langSelectMobile.value = lang;

    localStorage.setItem('swiftconvert_lang', lang);
}

/**
 * 3. 异步组件加载 (Nav/Footer)
 */
async function initSite() {
    const containers = [
        { id: 'nav-placeholder', path: 'nav.html' },
        { id: 'footer-placeholder', path: 'footer.html' }
    ];

    await Promise.all(containers.map(async (item) => {
        const el = document.getElementById(item.id);
        if (el) {
            try {
                const res = await fetch(item.path);
                if (res.ok) el.innerHTML = await res.text();
            } catch (err) { console.error(`Load failed: ${item.path}`, err); }
        }
    }));

    // 初始化页面语言
    applyLanguage(currentLang);

    // --- 3. 移动端菜单开关逻辑 ---
    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuPath = document.getElementById('menu-path');
    
    if (menuBtn && mobileMenu) {
        menuBtn.onclick = () => {
            const isHidden = mobileMenu.classList.toggle('hidden');
            if (!isHidden) {
                menuPath.setAttribute('d', 'M6 18L18 6M6 6l12 12');
            } else {
                menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
            }
        };
    }
    
    // --- 4. 移动端语言下拉框逻辑 ---
    const langSelectMobile = document.getElementById('lang-select-mobile');
    if (langSelectMobile) {
        langSelectMobile.onchange = (e) => {
            applyLanguage(e.target.value);
            
            // 切换后自动平滑收起菜单
            if (mobileMenu) mobileMenu.classList.add('hidden');
            if (menuPath) menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
        };
    }
    
    // --- 5. 桌面端语言切换按钮逻辑 ---
    // 因为 nav.html 是动态加载的，必须在 initSite 内部重新寻找并绑定
    const langToggle = document.getElementById('lang-toggle');
    if (langToggle) {
        langToggle.onclick = (e) => {
            e.preventDefault();
            // 切换语言
            const newLang = currentLang === 'en' ? 'zh' : 'en';
            applyLanguage(newLang);
        };
    }
}

function bindNavEvents() {
    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuPath = document.getElementById('menu-path');
    
    // 移动端菜单
    if (menuBtn && mobileMenu) {
        menuBtn.onclick = () => {
            const isHidden = mobileMenu.classList.toggle('hidden');
            if (menuPath) {
                menuPath.setAttribute('d', isHidden ? 'M4 6h16M4 12h16M4 18h16' : 'M6 18L18 6M6 6l12 12');
            }
        };
    }

    // 移动端语言下拉
    const langSelectMobile = document.getElementById('lang-select-mobile');
    if (langSelectMobile) {
        langSelectMobile.onchange = (e) => {
            applyLanguage(e.target.value);
            if (mobileMenu) mobileMenu.classList.add('hidden');
            if (menuPath) menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
        };
    }

    // 桌面端语言切换
    const langToggle = document.getElementById('lang-toggle');
    if (langToggle) {
        langToggle.onclick = (e) => {
            e.preventDefault();
            applyLanguage(currentLang === 'en' ? 'zh' : 'en');
        };
    }
}

// --- 3. 图片压缩业务逻辑 ---
let originalFile = null;

function initCompressTool() {
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const controls = document.getElementById('controls');
    const qualityRange = document.getElementById('quality-range');
    const qualityVal = document.getElementById('quality-val');
    const oldSize = document.getElementById('old-size');
    const newSize = document.getElementById('new-size');
    const previewImg = document.getElementById('preview-img');

    if (!dropZone || !fileInput) return;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (!file) return;
        originalFile = file;
        oldSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
        
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            controls.classList.remove('hidden');
            dropZone.classList.add('hidden');
            updateCompression();
        };
        reader.readAsDataURL(file);
    }

    function updateCompression() {
        if (!originalFile) return;
        const quality = qualityRange.value / 100;
        qualityVal.textContent = qualityRange.value + '%';
        const estimated = (originalFile.size * (quality * 0.9) / 1024).toFixed(1);
        newSize.textContent = estimated + ' KB';
    }

    qualityRange.oninput = updateCompression;

    document.getElementById('download-btn').onclick = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            const quality = qualityRange.value / 100;
            const link = document.createElement('a');
            link.download = `compressed-${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', quality);
            link.click();
        };
        img.src = previewImg.src;
    };

    document.getElementById('reset-btn').onclick = () => {
        controls.classList.add('hidden');
        dropZone.classList.remove('hidden');
        fileInput.value = "";
        originalFile = null;
    };
}

// --- 4. 启动启动 ---
document.addEventListener('DOMContentLoaded', () => {
    initSite();          // 加载 Nav/Footer/i18n
    initCompressTool();  // 加载压缩工具逻辑
});
</script>
