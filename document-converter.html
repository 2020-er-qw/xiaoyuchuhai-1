<script>
/**
 * 1. 语言初始化逻辑 (包含浏览器检测)
 */
// 1. 初始化当前语言 (增强版)
let currentLang = (() => {
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    if (langParam && i18nData[langParam]) return langParam;

    const savedLang = localStorage.getItem('swiftconvert_lang');
    if (savedLang && i18nData[savedLang]) return savedLang;

    // 浏览器语言检测
    const browserLangs = navigator.languages || [navigator.language];
    console.log("Browser languages found:", browserLangs); // 调试用

    for (let lang of browserLangs) {
        // 尝试完整匹配 (zh-CN)
        if (i18nData[lang]) return lang;
        
        // 尝试短码匹配 (zh)
        const short = lang.split('-')[0];
        if (i18nData[short]) return short;
    }

    return 'en';
})();

/**
 * 2. 核心辅助函数
 */
// 翻译函数
function t(key) {
    return (i18nData[currentLang] && i18nData[currentLang][key]) || key;
}

// 拼接任务文字的公共逻辑
function updateTaskText(el) {
    const statusKey = el.getAttribute('data-task-key');
    const extraKey = el.getAttribute('data-extra-key');
    const fileName = el.getAttribute('data-file-name');
    
    let text = t(statusKey); 
    if (extraKey) text += ` (${t(extraKey)})`; 
    if (fileName) text += ` - ${fileName}`; 
    
    el.innerText = text;
}

// 应用/切换语言
function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    
    // A. 静态元素翻译
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18nData[lang] && i18nData[lang][key]) el.innerHTML = i18nData[lang][key];
    });

    // B. 动态任务文字翻译 (包含状态 + 动作名称 + 文件名)
    document.querySelectorAll('[data-task-key]').forEach(el => {
        updateTaskText(el);
    });

    // C. 动态按钮翻译
    document.querySelectorAll('.btn-download-dynamic').forEach(el => {
        el.innerText = t('btn_download');
    });

    // D. UI 控件状态同步
    const langBtnText = document.getElementById('lang-btn-text');
    if (langBtnText) langBtnText.innerText = lang === 'en' ? '中文' : 'English';
    
    const langSelectMobile = document.getElementById('lang-select-mobile');
    if (langSelectMobile) langSelectMobile.value = lang;

    localStorage.setItem('swiftconvert_lang', lang);
}

/**
 * 3. 异步组件加载 (Nav/Footer)
 */
async function initSite() {
    const containers = [
        { id: 'nav-placeholder', path: 'nav.html' },
        { id: 'footer-placeholder', path: 'footer.html' }
    ];

    await Promise.all(containers.map(async (item) => {
        const el = document.getElementById(item.id);
        if (el) {
            try {
                const res = await fetch(item.path);
                if (res.ok) el.innerHTML = await res.text();
            } catch (err) { console.error(`Load failed: ${item.path}`, err); }
        }
    }));

    // 初始化页面语言
    applyLanguage(currentLang);

    // --- 3. 移动端菜单开关逻辑 ---
    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuPath = document.getElementById('menu-path');
    
    if (menuBtn && mobileMenu) {
        menuBtn.onclick = () => {
            const isHidden = mobileMenu.classList.toggle('hidden');
            if (!isHidden) {
                menuPath.setAttribute('d', 'M6 18L18 6M6 6l12 12');
            } else {
                menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
            }
        };
    }
    
    // --- 4. 移动端语言下拉框逻辑 ---
    const langSelectMobile = document.getElementById('lang-select-mobile');
    if (langSelectMobile) {
        langSelectMobile.onchange = (e) => {
            applyLanguage(e.target.value);
            
            // 切换后自动平滑收起菜单
            if (mobileMenu) mobileMenu.classList.add('hidden');
            if (menuPath) menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
        };
    }
    
    // --- 5. 桌面端语言切换按钮逻辑 ---
    // 因为 nav.html 是动态加载的，必须在 initSite 内部重新寻找并绑定
    const langToggle = document.getElementById('lang-toggle');
    if (langToggle) {
        langToggle.onclick = (e) => {
            e.preventDefault();
            // 切换语言
            const newLang = currentLang === 'en' ? 'zh' : 'en';
            applyLanguage(newLang);
        };
    }
}

/**
 * 4. UI 任务队列控制
 */
function createQueueItem(msgKey) {
    const container = document.getElementById('status-container');
    if (container) container.classList.remove('hidden');

    const li = document.createElement('li');
    li.className = "bg-slate-50 p-6 rounded-2xl flex items-center justify-between border border-slate-100 mb-3";
    li.innerHTML = `
        <div class="flex items-center space-x-4">
            <div class="status-indicator w-3 h-3 bg-indigo-600 rounded-full animate-pulse"></div>
            <span class="status-text text-slate-700 text-xs font-bold tracking-wider" 
                  data-task-key="${msgKey}">${t(msgKey)}</span>
        </div>
        <div class="action-area"></div>`;
    document.getElementById('task-list').prepend(li);
    return li;
}

function finishTask(li, blob, downloadName, typeNameKey, originalName = "") {
    const url = URL.createObjectURL(blob);
    const indicator = li.querySelector('.status-indicator');
    if (indicator) indicator.className = "status-indicator w-3 h-3 bg-emerald-500 rounded-full";
    
    li.querySelector('.action-area').innerHTML = 
        `<a href="${url}" download="${downloadName}" 
            class="btn-download-dynamic bg-indigo-600 text-white px-8 py-3 rounded-xl text-[10px] font-black shadow-lg hover:bg-indigo-700 transition-all">
            ${t('btn_download')}
         </a>`;
    
    const textEl = li.querySelector('.status-text');
    if (textEl) {
        textEl.setAttribute('data-task-key', 'status_done'); 
        textEl.setAttribute('data-extra-key', typeNameKey); 
        if (originalName) textEl.setAttribute('data-file-name', originalName);
        updateTaskText(textEl);
    }
}

function failTask(li) {
    const indicator = li.querySelector('.status-indicator');
    if (indicator) indicator.className = "status-indicator w-3 h-3 bg-red-500 rounded-full";
    const textEl = li.querySelector('.status-text');
    if (textEl) {
        textEl.setAttribute('data-task-key', 'status_error');
        textEl.innerText = t('status_error');
    }
}

/**
 * 5. 业务逻辑：图片预处理 (Canvas)
 */
async function processImageToJpg(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff'; // 白色背景处理透明图
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                canvas.toBlob((blob) => {
                    blob.arrayBuffer().then(resolve);
                }, 'image/jpeg', 0.9);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

/**
 * 6. 业务逻辑绑定 (Merge/Split/Convert)
 */
const { PDFDocument } = PDFLib;

// 合并 PDF
document.getElementById('merge-input').onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    const ui = createQueueItem('status_merging');
    try {
        const mergedPdf = await PDFDocument.create();
        for (const file of files) {
            const doc = await PDFDocument.load(await file.arrayBuffer());
            const pages = await mergedPdf.copyPages(doc, doc.getPageIndices());
            pages.forEach(p => mergedPdf.addPage(p));
        }
        const pdfBytes = await mergedPdf.save();
        const info = files.length + " files";
        finishTask(ui, new Blob([pdfBytes], {type:'application/pdf'}), "merged.pdf", 'merge_name', info);
    } catch (err) { failTask(ui); }
};

// 拆分 PDF
document.getElementById('split-input').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const ui = createQueueItem('status_splitting');
    try {
        const zip = new JSZip();
        const doc = await PDFDocument.load(await file.arrayBuffer());
        const count = doc.getPageCount();
        for (let i = 0; i < count; i++) {
            const subDoc = await PDFDocument.create();
            const [page] = await subDoc.copyPages(doc, [i]);
            subDoc.addPage(page);
            const bytes = await subDoc.save();
            zip.file(`page_${i+1}.pdf`, bytes);
        }
        const content = await zip.generateAsync({type:"blob"});
        finishTask(ui, content, "split_pages.zip", 'split_name', file.name);
    } catch (err) { failTask(ui); }
};

// 图片转 PDF (支持 WebP/PNG/JPG)
document.getElementById('img-to-pdf-input').onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    const ui = createQueueItem('status_converting');
    try {
        const pdfDoc = await PDFDocument.create();
        for (const file of files) {
            const bytes = await processImageToJpg(file); // 使用 Canvas 预处理
            const img = await pdfDoc.embedJpg(bytes);
            const page = pdfDoc.addPage([img.width, img.height]);
            page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
        }
        const pdfBytes = await pdfDoc.save();
        const info = files.length === 1 ? files[0].name : files.length + " images";
        finishTask(ui, new Blob([pdfBytes], {type: 'application/pdf'}), "images.pdf", 'img_pdf_name', info);
    } catch (err) { failTask(ui); }
};

// 初始化启动
document.addEventListener('DOMContentLoaded', () => {
    initSite();
    
    // 清空列表
    const clearBtn = document.getElementById('clear-all');
    if (clearBtn) {
        clearBtn.onclick = () => {
            document.getElementById('task-list').innerHTML = '';
            document.getElementById('status-container').classList.add('hidden');
            ['merge-input', 'split-input', 'img-to-pdf-input'].forEach(id => {
                document.getElementById(id).value = '';
            });
        };
    }
});
</script>
