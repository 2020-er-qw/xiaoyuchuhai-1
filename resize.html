    <style>
        /* 统一引入 Plus Jakarta Sans */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;

        }
            
        /* 移除所有强制大写和斜体，保持自然感 */

<body class="bg-slate-50 min-h-screen pt-24 pb-12">
	
<div id="nav-placeholder"></div> 

    <main class="max-w-5xl mx-auto px-6">
		
		<div class="text-center mb-12">
		    <h1 data-i18n="resize_title" class="text-4xl font-black text-slate-900 mb-4 tracking-tight"> <span class="text-indigo-600"></span></h1>
		    <p data-i18n="resize_desc" class="text-slate-500"></p>
		</div>

        <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 shadow-sm">
            <div id="drop-zone" class="drop-zone border-2 border-dashed border-slate-200 rounded-[2rem] p-12 text-center transition-all cursor-pointer hover:border-indigo-400 group">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <p class="font-black text-slate-900  tracking-tight" data-i18n="drop_text">Click or Drop Image Here</p>
                <p class="text-slate-400 text-xs mt-2" data-i18n="format_support">Supports JPG, PNG, WebP</p>
            </div>

            <div id="controls" class="hidden mt-8 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <label class="text-[10px] font-black text-slate-400 " data-i18n="width_label">Width (px)</label>
                            <input type="number" id="width-input" class="w-32 bg-slate-50 border-none rounded-xl px-4 py-2 font-black text-slate-900">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-[10px] font-black text-slate-400" data-i18n="height_label">Height (px)</label>
                            <input type="number" id="height-input" class="w-32 bg-slate-50 border-none rounded-xl px-4 py-2 font-black text-slate-900">
                        </div>
                        <div class="flex items-center space-x-2 py-2">
                            <input type="checkbox" id="aspect-ratio" checked>
                            <label for="aspect-ratio" class="text-xs font-bold text-slate-600" data-i18n="keep_ratio">Keep Aspect Ratio</label>
                        </div>
                    </div>
                    <div class="bg-slate-50 rounded-2xl p-4 flex items-center justify-center min-h-[200px]">
                        <img id="preview-img" class="max-h-48 rounded shadow-sm">
                    </div>
                </div>
                <button id="download-btn" class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black tracking-widest hover:bg-indigo-700 transition-all shadow-lg" data-i18n="download_btn">
                    Download Resized Image
                </button>
				<button id="reset-btn" class="w-full mt-4 py-3 text-slate-400 font-black  text-[10px] tracking-widest hover:text-indigo-600 transition-colors" data-i18n="reset_btn">
				    Upload Another Image
				</button>
            </div>
        </div>
		<section class="mt-24 mb-20 bg-indigo-50/50 py-16 rounded-[3rem]">
		    <div class="max-w-3xl mx-auto px-6 text-center">
		        <h2 class="text-3xl font-black mb-12 text-slate-900" data-i18n="faq_title">FAQ</h2>
		        <div class="space-y-6 text-left">
		            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
		                <h4 class="font-bold text-lg text-slate-900 mb-2" data-i18n="faq_resize_q1"></h4>
		                <p class="text-slate-500 text-sm leading-relaxed" data-i18n="faq_resize_a1"></p>
		            </div>
					<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
					    <h4 class="font-bold text-lg text-slate-900 mb-2" data-i18n="faq_resize_q2"></h4>
					    <p class="text-slate-500 text-sm leading-relaxed" data-i18n="faq_resize_a2"></p>
					</div>
					<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
					    <h4 class="font-bold text-lg text-slate-900 mb-2" data-i18n="faq_resize_q3"></h4>
					    <p class="text-slate-500 text-sm leading-relaxed" data-i18n="faq_resize_a3"></p>
					</div>
		        </div>
		    </div>
		</section>
		
    </main>

<div id="footer-placeholder"></div>
    <script>
	// 1. 初始化当前语言 (增强版)
	let currentLang = (() => {
	    const urlParams = new URLSearchParams(window.location.search);
	    const langParam = urlParams.get('lang');
	    if (langParam && i18nData[langParam]) return langParam;
	
	    const savedLang = localStorage.getItem('swiftconvert_lang');
	    if (savedLang && i18nData[savedLang]) return savedLang;
	
	    // 浏览器语言检测
	    const browserLangs = navigator.languages || [navigator.language];
	    console.log("Browser languages found:", browserLangs); // 调试用
	
	    for (let lang of browserLangs) {
	        // 尝试完整匹配 (zh-CN)
	        if (i18nData[lang]) return lang;
	        
	        // 尝试短码匹配 (zh)
	        const short = lang.split('-')[0];
	        if (i18nData[short]) return short;
	    }
	
	    return 'en';
	})();
	
	
	// 翻译辅助工具
	function t(key) {
	    return i18nData?.[currentLang]?.[key] || key;
	}
	
	// 应用/切换语言
	function applyLanguage(lang) {
	    currentLang = lang;
	    document.documentElement.lang = lang;
	    
	    // A. 静态元素翻译
	    document.querySelectorAll('[data-i18n]').forEach(el => {
	        const key = el.dataset.i18n;
	        if (i18nData[lang] && i18nData[lang][key]) el.innerHTML = i18nData[lang][key];
	    });
	
	    // B. 动态任务文字翻译 (包含状态 + 动作名称 + 文件名)
	    document.querySelectorAll('[data-task-key]').forEach(el => {
	        updateTaskText(el);
	    });
	
	    // C. 动态按钮翻译
	    document.querySelectorAll('.btn-download-dynamic').forEach(el => {
	        el.innerText = t('btn_download');
	    });
	
	    // D. UI 控件状态同步
	    const langBtnText = document.getElementById('lang-btn-text');
	    if (langBtnText) langBtnText.innerText = lang === 'en' ? '中文' : 'English';
	    
	    const langSelectMobile = document.getElementById('lang-select-mobile');
	    if (langSelectMobile) langSelectMobile.value = lang;
	
	    localStorage.setItem('swiftconvert_lang', lang);
	}
	
	/**
	 * 3. 异步组件加载 (Nav/Footer)
	 */
	async function initSite() {
	    const containers = [
	        { id: 'nav-placeholder', path: 'nav.html' },
	        { id: 'footer-placeholder', path: 'footer.html' }
	    ];
	
	    await Promise.all(containers.map(async (item) => {
	        const el = document.getElementById(item.id);
	        if (el) {
	            try {
	                const res = await fetch(item.path);
	                if (res.ok) el.innerHTML = await res.text();
	            } catch (err) { console.error(`Load failed: ${item.path}`, err); }
	        }
	    }));
	
	    // 初始化页面语言
	    applyLanguage(currentLang);
	
	    // --- 3. 移动端菜单开关逻辑 ---
	    const menuBtn = document.getElementById('mobile-menu-btn');
	    const mobileMenu = document.getElementById('mobile-menu');
	    const menuPath = document.getElementById('menu-path');
	    
	    if (menuBtn && mobileMenu) {
	        menuBtn.onclick = () => {
	            const isHidden = mobileMenu.classList.toggle('hidden');
	            if (!isHidden) {
	                menuPath.setAttribute('d', 'M6 18L18 6M6 6l12 12');
	            } else {
	                menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
	            }
	        };
	    }
	    
	    // --- 4. 移动端语言下拉框逻辑 ---
	    const langSelectMobile = document.getElementById('lang-select-mobile');
	    if (langSelectMobile) {
	        langSelectMobile.onchange = (e) => {
	            applyLanguage(e.target.value);
	            
	            // 切换后自动平滑收起菜单
	            if (mobileMenu) mobileMenu.classList.add('hidden');
	            if (menuPath) menuPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
	        };
	    }
	    
	    // --- 5. 桌面端语言切换按钮逻辑 ---
	    // 因为 nav.html 是动态加载的，必须在 initSite 内部重新寻找并绑定
	    const langToggle = document.getElementById('lang-toggle');
	    if (langToggle) {
	        langToggle.onclick = (e) => {
	            e.preventDefault();
	            // 切换语言
	            const newLang = currentLang === 'en' ? 'zh' : 'en';
	            applyLanguage(newLang);
	        };
	    }
	}


        // 图片处理逻辑 (保持原有逻辑)
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const controls = document.getElementById('controls');
        const widthInput = document.getElementById('width-input');
        const heightInput = document.getElementById('height-input');
        const previewImg = document.getElementById('preview-img');
        let originalImg = null;
        let ratio = 1;

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImg = img;
                    ratio = img.width / img.height;
                    widthInput.value = img.width;
                    heightInput.value = img.height;
                    previewImg.src = e.target.result;
                    controls.classList.remove('hidden');
                    dropZone.classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        widthInput.oninput = () => {
            if (document.getElementById('aspect-ratio').checked) {
                heightInput.value = Math.round(widthInput.value / ratio);
            }
        };

        heightInput.oninput = () => {
            if (document.getElementById('aspect-ratio').checked) {
                widthInput.value = Math.round(heightInput.value * ratio);
            }
        };

        document.getElementById('download-btn').onclick = () => {
            const canvas = document.createElement('canvas');
            canvas.width = widthInput.value;
            canvas.height = heightInput.value;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);
            const link = document.createElement('a');
            link.download = `resized-swiftconvert-${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        };
		// 重新上传按钮逻辑
		document.getElementById('reset-btn').onclick = () => {
		    // 1. 重置文件输入框
		    fileInput.value = "";
		    // 2. 清空预览图
		    previewImg.src = "";
		    originalImg = null;
		    // 3. 切换界面显示
		    controls.classList.add('hidden');
		    dropZone.classList.remove('hidden');
		    // 4. 平滑滚动回顶部
		    window.scrollTo({ top: 0, behavior: 'smooth' });
		};
		// --- 4. 启动启动 ---
		document.addEventListener('DOMContentLoaded', () => {
		    initSite();          // 加载 Nav/Footer/i18n
		});
    </script>
</body>
</html>
